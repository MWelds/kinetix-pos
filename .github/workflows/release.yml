name: Build & Release

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.1, v1.2.0, etc.

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build Windows installers
        run: npm run build && npx electron-builder --win --publish never

      - name: Create GitHub Release and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Create the release (fails gracefully if it already exists)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kinetix POS $TAG" \
            --notes "## Kinetix POS $TAG

          ### Downloads
          - **Setup installer** (recommended): \`Kinetix POS-${VERSION}-Setup.exe\`
          - **Portable** (no install required): \`Kinetix POS-${VERSION}-Portable.exe\`

          ### Installation
          Run the Setup installer and follow the prompts. The app works fully offline." \
            --latest || echo "Release may already exist — continuing to upload assets"

          # Upload installers, blockmap, and latest.yml (required for auto-update)
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.exe \
            dist/*.blockmap \
            dist/latest.yml
